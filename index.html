<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --panel: #2a2a3c;
      --line: #45475a;
      --x-color: #89b4fa;
      --o-color: #f38ba8;
      --text: #cdd6f4;
      --accent: #a6e3a1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
    }

    h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    #status {
      font-size: 1.25rem;
      min-height: 1.5em;
      font-weight: 600;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 96px);
      grid-template-rows: repeat(3, 96px);
      gap: 8px;
      background: var(--line);
      padding: 8px;
      border-radius: 12px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: none;
      border-radius: 8px;
      font-size: 3rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s ease, transform 0.05s ease;
      user-select: none;
    }

    .cell:hover:not(:disabled) { background: #33334a; }
    .cell:active:not(:disabled) { transform: scale(0.96); }
    .cell:disabled { cursor: default; }

    .cell.x { color: var(--x-color); }
    .cell.o { color: var(--o-color); }
    .cell.win { background: var(--accent); color: #1e1e2e; }

    #reset {
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--x-color);
      color: #1e1e2e;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    #reset:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="status">Player X's turn</div>
  <div id="board" role="grid" aria-label="Tic-Tac-Toe board"></div>
  <button id="reset">New Game</button>

  <script>
    (function () {
      const WINNING_LINES = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
        [0, 4, 8], [2, 4, 6],            // diagonals
      ];

      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const resetBtn = document.getElementById("reset");

      let board;          // array of 9: "", "X", or "O"
      let currentPlayer;  // "X" or "O"
      let gameOver;

      const cells = [];

      function init() {
        board = Array(9).fill("");
        currentPlayer = "X";
        gameOver = false;
        cells.forEach((cell) => {
          cell.textContent = "";
          cell.disabled = false;
          cell.className = "cell";
        });
        statusEl.textContent = "Player X's turn";
      }

      function buildBoard() {
        for (let i = 0; i < 9; i++) {
          const cell = document.createElement("button");
          cell.className = "cell";
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("aria-label", "cell " + (i + 1));
          cell.dataset.index = i;
          cell.addEventListener("click", () => handleMove(i));
          boardEl.appendChild(cell);
          cells.push(cell);
        }
      }

      function checkWinner() {
        for (const line of WINNING_LINES) {
          const [a, b, c] = line;
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return { winner: board[a], line };
          }
        }
        return null;
      }

      function handleMove(index) {
        if (gameOver || board[index]) return;

        board[index] = currentPlayer;
        const cell = cells[index];
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer.toLowerCase());
        cell.disabled = true;

        const result = checkWinner();
        if (result) {
          gameOver = true;
          statusEl.textContent = "Player " + result.winner + " wins! 🎉";
          result.line.forEach((i) => cells[i].classList.add("win"));
          cells.forEach((c) => (c.disabled = true));
          return;
        }

        if (board.every((v) => v !== "")) {
          gameOver = true;
          statusEl.textContent = "It's a draw!";
          return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusEl.textContent = "Player " + currentPlayer + "'s turn";
      }

      resetBtn.addEventListener("click", init);

      buildBoard();
      init();
    })();
  </script>
</body>
</html>
